name: BUILD
on: 
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest    
    timeout-minutes: 5
    steps:
    - name: Pull zeebe
      run: docker pull camunda/zeebe:8.8.16
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: |
          8.x
          9.x
          10.x
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: dotnet test --configuration Release --no-build